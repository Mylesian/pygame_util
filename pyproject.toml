[build-system]
requires = ["flit_core >= 3.12.0, <5"]
build-backend = "flit_core.buildapi"

[project]
name = "pygame_util"
version = "0.0.1"
authors = [
  { name="Myles Godfrey", email="mylesgodfrey17@gmail.com" },
]
description = "pygame utility package so I don't have to rewrite all my code every project"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

[project.urls]
Homepage = "https://github.com/Mylesian/pygame_util"